name: Publish packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: "release tag, example: v1.0.2 (empty = latest release)"
        required: false
        default: ""
      targets:
        description: "user repositories to publish to"
        type: choice
        default: all
        options:
          - all
          - copr
          - obs
          - ppa
      ppa_series:
        description: "ubuntu series for the ppa, example: noble (empty = keep the suite from the changelog)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: "resolve release"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          tag="$RELEASE_INPUT"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no release found, set the release input to an existing tag"
            exit 1
          fi
          echo "release to publish: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  copr:
    name: "copr (fedora)"
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.tag != '' && (inputs.targets == 'all' || inputs.targets == 'copr')
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      COPR_PROJECT: ${{ vars.COPR_PROJECT || 'atlifm' }}
    steps:
      - name: Check the credentials
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::the COPR_CONFIG secret is not set, see packaging/README.md"
            exit 1
          fi

      - name: Install copr-cli
        run: |
          if command -v pipx > /dev/null 2>&1; then
            pipx install copr-cli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-venv
            python3 -m venv "$RUNNER_TEMP/copr-venv"
            "$RUNNER_TEMP/copr-venv/bin/pip" install -q copr-cli
            echo "$RUNNER_TEMP/copr-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Download the source rpm
        run: |
          mkdir -p sources
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sources \
            --pattern '*.src.rpm'

      - name: Submit the build
        run: |
          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"
          copr-cli build "$COPR_PROJECT" sources/*.src.rpm

  obs:
    name: "obs (opensuse)"
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.tag != '' && (inputs.targets == 'all' || inputs.targets == 'obs')
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      OBS_OSCRC: ${{ secrets.OBS_OSCRC }}
      OBS_PROJECT: ${{ vars.OBS_PROJECT || 'home:1nfys' }}
      OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'atlifm' }}
    steps:
      - name: Check the credentials
        run: |
          if [ -z "$OBS_OSCRC" ]; then
            echo "::error::the OBS_OSCRC secret is not set, see packaging/README.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install osc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osc cpio rpm2cpio

      - name: Download the sources
        run: |
          mkdir -p sources
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sources \
            --pattern '*.src.rpm' \
            --pattern '*.dsc' \
            --pattern '*.orig.tar.gz' \
            --pattern '*.debian.tar.*'

      - name: Write the obs login
        run: |
          mkdir -p "$HOME/.config/osc"
          printf '%s\n' "$OBS_OSCRC" > "$HOME/.config/osc/oscrc"
          chmod 600 "$HOME/.config/osc/oscrc"

      - name: Upload the sources
        run: |
          work=$(mktemp -d)
          cd "$work"
          printf '<package name="%s" project="%s"><title>%s</title><description>atlifm</description></package>\n' \
            "$OBS_PACKAGE" "$OBS_PROJECT" "$OBS_PACKAGE" \
            | osc --no-keyring meta pkg "$OBS_PROJECT" "$OBS_PACKAGE" -F -
          osc --no-keyring co "$OBS_PROJECT" "$OBS_PACKAGE"
          cd "$OBS_PROJECT/$OBS_PACKAGE"
          rm -f -- ./*.tar.gz ./*.tar.xz ./*.tar.bz2 ./*.dsc ./*.changes
          rpm2cpio "$GITHUB_WORKSPACE"/sources/*.src.rpm | cpio -idmu 2>/dev/null
          cp "$GITHUB_WORKSPACE/packaging/rpm/atlifm.spec" .
          cp "$GITHUB_WORKSPACE"/sources/*.dsc "$GITHUB_WORKSPACE"/sources/*.orig.tar.gz \
             "$GITHUB_WORKSPACE"/sources/*.debian.tar.* .
          osc --no-keyring ar
          osc --no-keyring ci -m "atlifm $TAG"

  ppa:
    name: "ppa (ubuntu)"
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.tag != '' && (inputs.targets == 'all' || inputs.targets == 'ppa')
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      LAUNCHPAD_SSH_KEY: ${{ secrets.LAUNCHPAD_SSH_KEY }}
      LP_LOGIN: ${{ vars.LP_LOGIN || '1nfys' }}
      LP_PPA: ${{ vars.LP_PPA || 'atlifm' }}
      PPA_SERIES: ${{ inputs.ppa_series || vars.LP_SERIES || 'resolute' }}
    steps:
      - name: Check the credentials
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$LAUNCHPAD_SSH_KEY" ]; then
            echo "::error::the GPG_PRIVATE_KEY and LAUNCHPAD_SSH_KEY secrets are both required, see packaging/README.md"
            exit 1
          fi

      - name: Install dput
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dput-ng devscripts gnupg python3-paramiko python3-jsonschema

      - name: Download the source package
        run: |
          mkdir -p sources
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sources \
            --pattern '*.dsc' \
            --pattern '*.orig.tar.gz' \
            --pattern '*.debian.tar.*' \
            --pattern '*.buildinfo' \
            --pattern '*_source.changes'

      - name: Unlock the signing key
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$keyid" ]; then
            echo "::error::no secret key found in GPG_PRIVATE_KEY"
            exit 1
          fi
          echo "signing key: $keyid"
          echo "GPG_KEY_ID=$keyid" >> "$GITHUB_ENV"

      - name: Set up the ssh key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$LAUNCHPAD_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf 'Host ppa.launchpad.net\n    IdentityFile ~/.ssh/id_ed25519\n    IdentitiesOnly yes\n' > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -t rsa,ecdsa,ed25519 ppa.launchpad.net >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Sign and upload
        run: |
          mkdir -p "$HOME/.dput.d/profiles"
          incoming="~$LP_LOGIN/ubuntu/$LP_PPA/"
          if [ -n "$PPA_SERIES" ]; then
            incoming="$incoming$PPA_SERIES/"
          fi
          printf '{\n    "fqdn": "ppa.launchpad.net",\n    "incoming": "%s",\n    "login": "%s",\n    "method": "sftp"\n}\n' \
            "$incoming" "$LP_LOGIN" > "$HOME/.dput.d/profiles/atlifm-ppa.json"
          cd sources
          debsign -k "$GPG_KEY_ID" ./*_source.changes
          dput atlifm-ppa ./*_source.changes
